name: Inspect MStar input switching
on:
  push:
    paths:
      - 'folder./tvsettinghotkey.apk'
      - 'folder./MstTvProvider.apk'
      - '.github/workflows/analyze-hotkey.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JADX
        run: |
          mkdir -p /tmp/jadx
          curl -fL --retry 6 --retry-all-errors --retry-delay 8 --retry-max-time 240 https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Decompile and inspect launch path
        run: |
          /tmp/jadx/bin/jadx -d /tmp/hotkey folder./tvsettinghotkey.apk
          echo '===== COMMONSKIN METHODS ====='
          sed -n '85,145p' /tmp/hotkey/sources/com/mstar/tv/service/skin/CommonSkin.java
          echo '===== INPUT ACTIVITY SOURCE SELECTION ====='
          sed -n '180,270p' /tmp/hotkey/sources/com/mstar/tvsetting/hotkey/InputSourceListViewActivity.java
          sed -n '420,590p' /tmp/hotkey/sources/com/mstar/tvsetting/hotkey/InputSourceListViewActivity.java
          echo '===== INPUT ACTIVITY LIFECYCLE AND INTENTS ====='
          grep -nE 'onCreate|onResume|onStart|onNewIntent|getIntent|get.*Extra|putExtra|switchSource|inputSource =' /tmp/hotkey/sources/com/mstar/tvsetting/hotkey/InputSourceListViewActivity.java | head -n 160
          echo '===== ENUM AND AIDL ====='
          cat /tmp/hotkey/sources/com/mstar/tv/service/aidl/EN_INPUT_SOURCE_TYPE.java
          grep -n -A15 -B5 'SetInputSource' /tmp/hotkey/sources/com/mstar/tv/service/interfaces/ITvServiceServerCommon.java | head -n 70
          echo '===== MANIFEST ====='
          sed -n '1,240p' /tmp/hotkey/resources/AndroidManifest.xml
