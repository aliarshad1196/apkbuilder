name: Inspect MStar input switching
on:
  push:
    paths:
      - 'folder./tvsettinghotkey.apk'
      - 'folder./MstTvProvider.apk'
      - '.github/workflows/analyze-hotkey.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JADX
        run: |
          mkdir -p /tmp/jadx
          curl -fL --retry 6 --retry-all-errors --retry-delay 8 --retry-max-time 240 https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Decompile and inspect binding API
        run: |
          /tmp/jadx/bin/jadx -d /tmp/hotkey folder./tvsettinghotkey.apk
          echo '===== COMMONSKIN CLASS START ====='
          sed -n '1,100p' /tmp/hotkey/sources/com/mstar/tv/service/skin/CommonSkin.java
          echo '===== TV SERVICE SERVER INTERFACE ====='
          sed -n '1,220p' /tmp/hotkey/sources/com/mstar/tv/service/interfaces/ITvServiceServer.java
          echo '===== COMMON SERVICE INTERFACE HEADER ====='
          sed -n '1,100p' /tmp/hotkey/sources/com/mstar/tv/service/interfaces/ITvServiceServerCommon.java
          echo '===== ENUM FULL ====='
          cat /tmp/hotkey/sources/com/mstar/tv/service/aidl/EN_INPUT_SOURCE_TYPE.java
          echo '===== HOTKEY BASE ACTIVITY BINDING ====='
          grep -R -nE 'new CommonSkin|\.connect\(|CommonSkin\(' /tmp/hotkey/sources/com/mstar/tvsetting/hotkey | head -n 100
          echo '===== SERVICE BINDING REFERENCES ====='
          grep -R -nE 'tv_services|ServiceManager|getService|ITvServiceServer\.Stub|asInterface|bindService' /tmp/hotkey/sources/com/mstar/tv/service | head -n 140

      - name: Inspect binder transaction and permission
        run: |
          echo '===== COMMON AIDL TRANSACTION IDS ====='
          grep -n -A30 -B8 'TRANSACTION_SetInputSource' /tmp/hotkey/sources/com/mstar/tv/service/interfaces/ITvServiceServerCommon.java | head -n 100
          echo '===== PERMISSION REFERENCES ====='
          grep -R -n 'com.mstar.permission.RW_TV_DATA' /tmp/hotkey/resources /tmp/hotkey/sources | head -n 30
          echo '===== PROVIDER MANIFEST ====='
          /tmp/jadx/bin/jadx -d /tmp/provider folder./MstTvProvider.apk >/dev/null 2>&1
          sed -n '1,180p' /tmp/provider/resources/AndroidManifest.xml
