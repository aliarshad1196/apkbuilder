name: Build HDMI 1 Startup APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hdmihelper/**'
      - '.github/workflows/build-hdmi-helper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build HDMI helper
        run: gradle :hdmihelper:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HDMI-1-Startup-Boot
          path: hdmihelper/build/outputs/apk/debug/hdmihelper-debug.apk
          if-no-files-found: error
