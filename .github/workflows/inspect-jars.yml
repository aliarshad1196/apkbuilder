name: Inspect TV Firmware Interfaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jars/**'
      - '.github/workflows/inspect-jars.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download JADX release
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          JADX_URL=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".zip")))')
          curl -fL "$JADX_URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          JADX_BIN=$(find /tmp/jadx -type f -path '*/bin/jadx' | head -1)
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"
      - name: Decompile framework and MStar APKs
        run: |
          mkdir -p inspection
          for f in jars/*.jar folder./*.apk; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            safe=$(echo "$name" | tr '. ' '__')
            echo "Decompiling $f"
            "$JADX_BIN" --no-res -d "inspection/$safe" "$f" || true
          done
      - name: Extract MStar Binder evidence
        run: |
          {
            echo '=== Binder / input-source references ==='
            grep -RniE 'ITvServiceServer|ITvServiceServerCommon|SetInputSource|GetCommon|tv_services|InputSource' inspection || true
            echo '=== JAR/APK entries ==='
            for f in jars/*.jar folder./*.apk; do
              [ -f "$f" ] || continue
              echo "--- $f"
              unzip -l "$f" | head -60
            done
          } > inspection-report.txt
          test -s inspection-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tv-firmware-inspection
          path: |
            inspection-report.txt
            inspection/
          if-no-files-found: error
          retention-days: 7
